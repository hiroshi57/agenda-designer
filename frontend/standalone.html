<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>会議アジェンダ設計 — 目的から進行台本を作る</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>
<style>
body{font-family:system-ui,sans-serif;background:#f5f6f8;margin:0;padding:24px;color:#1a1a2e}
.wrap{max-width:920px;margin:0 auto} h1{font-size:23px;color:#0a7d5a;margin-bottom:4px}
h2{font-size:17px;margin:2px 0 8px} h3{font-size:14px;margin:12px 0 4px} .sub{color:#8a8f9c;font-size:12px}
.card{background:#fff;border-radius:12px;padding:18px;margin:14px 0;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.stepbadge{display:inline-block;background:#0a7d5a;color:#fff;border-radius:20px;padding:3px 12px;font-size:12px;font-weight:bold;margin-bottom:8px}
.intro{background:#e7f7ef;border-radius:12px;padding:16px;font-size:14px;line-height:1.9}
.intro .q{font-weight:bold;color:#0a7d5a;font-size:15px;margin-top:12px}
.intro .q:first-child{margin-top:0}
.guide{background:#fffbeb;border:2px dashed #f0c86a;border-radius:12px;padding:14px 16px;font-size:14px;line-height:1.8;color:#7a5b00}
.guide b{color:#5c4400}
table{border-collapse:collapse;width:100%;font-size:13.5px} th,td{border:1px solid #dde;padding:8px 6px;text-align:center} th{background:#e7f7ef;font-size:12.5px}
td.l,th.l{text-align:left} tbody tr:nth-child(even){background:#fafbfd}
td input,td select{border:1.5px solid #b9cbe4;border-radius:6px;padding:6px;font-size:14px}
td input{width:78px;text-align:right} td input.nm{width:150px;text-align:left} td select{background:#fff}
input.big,textarea{width:100%;border:1.5px solid #b9cbe4;border-radius:8px;padding:10px;font-size:14px;font-family:inherit}
textarea{min-height:130px;line-height:1.7}
.metrics{display:flex;gap:12px;flex-wrap:wrap} .metric{flex:1;min-width:145px;background:#e7f7ef;border-radius:10px;padding:14px;text-align:center}
.metric .val{font-size:25px;font-weight:bold;color:#0a7d5a} .metric .l{font-size:12px;color:#556;margin-top:4px;line-height:1.5}
.verdict{border-radius:12px;padding:18px;margin:10px 0}
.vgood{background:#e7f7ef;border:2px solid #17a673} .vmid{background:#fff8e6;border:2px solid #f0a500} .vbad{background:#fdeeee;border:2px solid #e0533b}
.verdict .big{font-size:20px;font-weight:bold} .verdict .desc{font-size:14px;line-height:1.9;margin-top:8px}
.todo{background:#e7f7ef;border:1px solid #d6e4f7;border-radius:10px;padding:14px;margin-top:10px}
.todo li{margin:9px 0;line-height:1.8;font-size:14px}
.chk{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid #eef1f5;font-size:14px;line-height:1.7}
.chk .mark{font-size:18px;flex-shrink:0;width:24px}
button{border:0;border-radius:9px;cursor:pointer;font-size:14px;padding:10px 16px}
button.go{background:#0a7d5a;color:#fff;font-size:15px} button.add{background:#0a7d5a;color:#fff;margin-top:10px}
button.ghost{background:#eef2f8;color:#0a7d5a;margin-left:8px;font-size:13px;padding:9px 14px}
button.del{background:#f7e4e4;color:#c0392b;padding:4px 10px;font-size:15px}
.src{background:#f7f9fb;border:1px solid #e0e6ec;border-left:4px solid #8a8f9c;border-radius:8px;padding:12px;font-size:13px;color:#445;line-height:1.9;margin:10px 0}
.src b{color:#1a1a2e} .src div{margin:4px 0}
.note{color:#8a8f9c;font-size:12px;line-height:1.7}
.bar{background:#eef1f5;border-radius:7px;height:28px;overflow:hidden;margin:5px 0}
.bar>div{height:28px;border-radius:7px;display:flex;align-items:center;justify-content:flex-end;padding-right:9px;color:#fff;font-size:13px;font-weight:bold}
.pill{padding:3px 10px;border-radius:12px;font-size:11.5px;font-weight:bold;white-space:nowrap}
pre{background:#f7f9fb;border:1px solid #e0e6ec;border-radius:8px;padding:12px;overflow-x:auto;font-size:12.5px;line-height:1.6}
@media(max-width:640px){body{padding:12px} .wrap{max-width:100%} h1{font-size:19px}
 table{display:block;overflow-x:auto;white-space:nowrap;font-size:12.5px} .metrics{flex-direction:column}}
</style>
</head>
<body>
<div style="max-width:900px;margin:0 auto 4px;background:#fff8e1;border:1px solid #f0d98a;border-radius:10px;padding:10px 14px;font:13.5px system-ui;color:#7a5b00">🔬 <b>入力するだけで計算します</b>：会議の<b>目的・時間・議題</b>を入れると、時間配分と案内文を自動で作ります。　AIサービスへの接続は不要で、計算はすべてこの画面の中で行われます。</div>
<div id="root"></div>
<script type="text/plain" id="__jsx">
// ===== 自動保存 & データ書き出し/読み込み =====
const STORE="agenda_v1";
function usePersist(name,initial){
  const [v,setV]=React.useState(function(){
    try{var s=localStorage.getItem(STORE+":"+name);return s?JSON.parse(s):initial;}catch(e){return initial;}
  });
  React.useEffect(function(){try{localStorage.setItem(STORE+":"+name,JSON.stringify(v));}catch(e){}},[name,v]);
  return [v,setV];
}
function collectAll(){var o={};for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);
  if(k&&k.indexOf(STORE+":")===0){try{o[k.slice(STORE.length+1)]=JSON.parse(localStorage.getItem(k));}catch(e){}}}return o;}
function DataBar(){
  const [msg,setMsg]=React.useState(""); const fileRef=React.useRef(null);
  const save=function(){try{
      var blob=new Blob([JSON.stringify({_tool:STORE,_savedAt:new Date().toISOString(),data:collectAll()},null,2)],{type:"application/json"});
      var a=document.createElement("a");a.href=URL.createObjectURL(blob);
      a.download=STORE+"_"+new Date().toISOString().slice(0,10)+".json";a.click();URL.revokeObjectURL(a.href);
      setMsg("書き出しました");setTimeout(function(){setMsg("");},2500);}catch(e){setMsg("書き出しに失敗しました");}};
  const load=function(e){var f=e.target.files&&e.target.files[0];if(!f)return;var rd=new FileReader();
    rd.onload=function(){try{var j=JSON.parse(rd.result);if(!j||!j.data)throw new Error("形式が違います");
      Object.keys(j.data).forEach(function(k){localStorage.setItem(STORE+":"+k,JSON.stringify(j.data[k]));});
      location.reload();}catch(err){setMsg("読み込めませんでした");}};rd.readAsText(f);};
  const clear=function(){if(!confirm("入力した内容をすべて消して最初の状態に戻します。よろしいですか？"))return;
    var del=[];for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf(STORE+":")===0)del.push(k);}
    del.forEach(function(k){localStorage.removeItem(k);});location.reload();};
  return (<div style={{background:"#f2f7f4",border:"1px solid #cfe3d8",borderRadius:10,padding:"9px 12px",
      margin:"0 0 12px",fontSize:13,display:"flex",gap:8,alignItems:"center",flexWrap:"wrap",color:"#0f5c3f"}}>
    <span>💾 <b>入力した内容はこの端末に自動保存されます</b>（閉じても消えません）</span>
    <span style={{flex:1}}></span>
    <button onClick={save} style={{border:0,borderRadius:7,background:"#17a673",color:"#fff",padding:"6px 11px",cursor:"pointer",fontSize:12.5}}>データを書き出す</button>
    <button onClick={function(){fileRef.current&&fileRef.current.click();}} style={{border:0,borderRadius:7,background:"#e7f0eb",color:"#0f5c3f",padding:"6px 11px",cursor:"pointer",fontSize:12.5}}>読み込む</button>
    <button onClick={clear} style={{border:0,borderRadius:7,background:"#f7e4e4",color:"#c0392b",padding:"6px 11px",cursor:"pointer",fontSize:12.5}}>最初に戻す</button>
    <input ref={fileRef} type="file" accept="application/json" onChange={load} style={{display:"none"}}/>
    {msg && <span style={{fontWeight:"bold"}}>{msg}</span>}
  </div>);
}
function Intro(){
  return (<div className="card"><div className="intro">
    <div className="q">🎯 このツールで分かること</div><div>「なんとなく集まって終わる会議」を防ぎます。目的に応じた時間配分を計算し、そのまま送れる案内文まで作ります。</div>
    <div className="q">🙋 こんな人向け</div><div>・会議を<b>主催する</b>立場の人（マネージャー・プロジェクト担当）<br/>・会議が長い/決まらないと感じている人<br/>・若手に会議の進め方を<b>教える</b>立場の人</div>
    <div className="q">📝 やること</div><div>目的を選び、議題を並べるだけ。時間配分と案内文が自動で出ます。</div>
  </div></div>);
}

const GOALS=[
  {k:"決める",   ratio:{共有:15,議論:45,決定:30,確認:10}, need:"決裁権のある人", warn:"決裁者がいないと決まりません。"},
  {k:"意見を集める",ratio:{共有:20,議論:60,決定:10,確認:10}, need:"現場を知る人", warn:"人数が多すぎると発言しない人が出ます。"},
  {k:"共有する", ratio:{共有:70,議論:15,決定:5,確認:10}, need:"聞くべき人", warn:"共有だけなら、資料配布で代替できないか検討してください。"},
  {k:"案を作る", ratio:{共有:15,議論:65,決定:10,確認:10}, need:"手を動かす人", warn:"6人を超えるとアイデアが発散しません。"},
];
const IDEAL={"決める":6,"意見を集める":8,"共有する":30,"案を作る":5};

function App(){
  const [goal,setGoal]=usePersist("goal","決める");
  const [min,setMin]=usePersist("min",60);
  const [people,setPeople]=usePersist("people",8);
  const [topics,setTopics]=usePersist("topics",[
    {name:"先月の実績の共有",kind:"共有"},
    {name:"広告費の配分をどうするか",kind:"議論"},
    {name:"来月の予算を決める",kind:"決定"},
  ]);
  const g=GOALS.find(x=>x.k===goal)||GOALS[0];
  const ideal=IDEAL[goal];
  const over=people-ideal;
  // 種別ごとの理想時間配分から、議題1つあたりの時間を実計算
  const byKind={};
  topics.forEach(t=>{byKind[t.kind]=(byKind[t.kind]||0)+1;});
  const alloc=topics.map(t=>{
    const share=g.ratio[t.kind]||10;
    const cnt=byKind[t.kind]||1;
    return {...t, minutes:Math.max(3,Math.round(min*share/100/cnt))};
  });
  const used=alloc.reduce((a,x)=>a+x.minutes,0);
  const buffer=min-used;
  const upd=(i,k,v)=>setTopics(ts=>ts.map((t,j)=>j===i?{...t,[k]:v}:t));
  const del=i=>setTopics(ts=>ts.filter((_,j)=>j!==i));
  const add=()=>setTopics(ts=>[...ts,{name:"新しい議題",kind:"議論"}]);
  const KINDS=["共有","議論","決定","確認"];

  return (<div className="wrap"><DataBar/>
    <h1>会議アジェンダ設計</h1>
    <div className="sub" style={{marginBottom:10}}>会議の目的から、時間配分と進行の台本を自動で作ります。</div>
    <Intro/>

    <div className="card">
      <div className="stepbadge">STEP 1</div>
      <h2>会議の目的と条件</h2>
      <div className="guide">
        👇 <b>ここを選んでください。</b>目的を選ぶと、時間配分の考え方が変わります。<br/>
        「決める」会議と「共有する」会議では、必要な時間の使い方がまったく違います。
      </div>
      <div style={{marginTop:12,fontSize:14,lineHeight:2.2}}>
        この会議の目的は
        <select value={goal} onChange={e=>setGoal(e.target.value)}
          style={{fontSize:15,padding:"7px 10px",border:"1.5px solid #b9cbe4",borderRadius:7,margin:"0 6px"}}>
          {GOALS.map(x=>(<option key={x.k}>{x.k}</option>))}</select>こと<br/>
        時間は <input type="number" value={min} onChange={e=>setMin(Number(e.target.value)||0)}
          style={{width:80,fontSize:15,padding:"6px",border:"1.5px solid #b9cbe4",borderRadius:7,textAlign:"right"}}/> 分、
        参加者は <input type="number" value={people} onChange={e=>setPeople(Number(e.target.value)||0)}
          style={{width:70,fontSize:15,padding:"6px",border:"1.5px solid #b9cbe4",borderRadius:7,textAlign:"right"}}/> 人
      </div>
      <div className={"verdict "+(over<=0?"vgood":over<=3?"vmid":"vbad")} style={{marginTop:12}}>
        <div className="big">{over<=0?"✅ 人数は適正です":"⚠ 参加者が"+over+"人多いかもしれません"}</div>
        <div className="desc">
          「{goal}」会議に必要なのは<b>{g.need}</b>で、目安は<b>{ideal}人</b>です。
          {over>0 && <span> いまは{people}人。{over}人は<b>議事録の共有だけ</b>にできないか検討してください。</span>}
          <br/>{g.warn}
        </div>
      </div>
    </div>

    <div className="card">
      <div className="stepbadge">STEP 2</div>
      <h2>議題を並べる</h2>
      <div className="guide">
        👇 <b>ここに入力してください。</b>議題ごとに「共有・議論・決定・確認」のどれかを選ぶと、時間配分を自動計算します。
      </div>
      <table style={{marginTop:12}}><thead><tr><th className="l">議題</th><th>種類</th><th>配分時間</th><th></th></tr></thead>
        <tbody>{alloc.map((t,i)=>(<tr key={i}>
          <td className="l"><input className="nm" style={{width:"100%"}} value={t.name} onChange={e=>upd(i,"name",e.target.value)}/></td>
          <td><select value={t.kind} onChange={e=>upd(i,"kind",e.target.value)}>{KINDS.map(k=>(<option key={k}>{k}</option>))}</select></td>
          <td><b>{t.minutes}分</b></td>
          <td><button className="del" onClick={()=>del(i)}>×</button></td></tr>))}
        </tbody></table>
      <button className="add" onClick={add}>＋ 議題を追加</button>
      <div className="sub" style={{marginTop:8}}>
        合計 {used}分 ／ 予定 {min}分（{buffer>=0?"余り "+buffer+"分":"超過 "+Math.abs(buffer)+"分"}）
      </div>
      <div className="src">
        <b>❓ 時間配分はどう決めているの？</b>
        <div>・目的ごとに「共有・議論・決定・確認」の<b>理想の時間比率</b>を持っており、そこから議題数で割って計算しています。</div>
        <div>・例：「決める」会議なら 共有15% / 議論45% / 決定30% / 確認10%。</div>
        <div>・この比率は<b>当社が設定した基準</b>で、公的な標準ではありません。自社に合わせて調整してください。</div>
        <div>・最初の3議題は<b>使い方を示す例</b>です（架空の議題）。</div>
      </div>
    </div>

    <div className="card">
      <div className="stepbadge">STEP 3</div>
      <h2>そのまま送れる案内文</h2>
      <pre>{"件名：【"+goal+"】"+(alloc[0]?alloc[0].name:"会議")+" ("+min+"分)\n\n"+
"■ この会議のゴール\n　"+goal+"（"+(goal==="決める"?"この場で結論を出します":goal==="共有する"?"質疑応答のみ、議論はしません":"意見を出し切ります")+"）\n\n"+
"■ 進行（合計"+used+"分"+(buffer>0?" ＋予備"+buffer+"分":"")+"）\n"+
alloc.map((t,i)=>"　"+(i+1)+". ["+t.kind+"] "+t.name+"（"+t.minutes+"分）").join("\n")+"\n\n"+
"■ 事前におねがい\n　・資料は前日までに共有します。目を通してからご参加ください。\n　・会議中の資料読み上げはしません。\n\n"+
"■ 参加者\n　"+people+"名（"+g.need+"）\n"+(over>0?"　※ご都合が合わない方は議事録の共有のみで結構です。\n":"")}</pre>
      <div className="todo">
        <b>会議をうまく進めるコツ</b>
        <ul>
          <li><b>議題名を「〜について」で終わらせない</b>：「広告費について」ではなく「<b>広告費を月10万増やすか決める</b>」と書くと、何をすべきか全員に伝わります。</li>
          {byKind["共有"]>=2 && <li><b>「共有」の議題が{byKind["共有"]}件あります</b>：共有だけなら会議は不要かもしれません。資料配布に変えられないか検討してください。</li>}
          {!byKind["決定"] && goal==="決める" && <li><b>「決定」の議題がありません</b>：目的が「決める」なら、決定する議題を必ず入れてください。</li>}
          <li><b>終了5分前に必ず「決まったこと」を読み上げる</b>：これだけで議事録の質が上がり、認識のズレが消えます。</li>
        </ul>
      </div>
    </div>

    <p className="note">※時間配分は入力された時間・議題数から計算した目安です。実際の進行は状況により変わります。<br/>
    ※人数の目安（決める6人・議論8人など）は当社の基準であり、公的な研究に基づく数値ではありません。</p>
  </div>);
}

</script>
<script>(function(){var src=document.getElementById("__jsx").textContent;var out=Babel.transform(src,{presets:[["react",{runtime:"classic"}]]}).code;(0,eval)(out);ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));})();</script>
</body></html>
